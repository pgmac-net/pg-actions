name: SBOM Generator

# This is a start on some SBoM building, scanning and attestation.
# There are 2 pieces to this right now:
# 1. Generate a CycloneDX SBoM, make an artefact, create an attestation of said artefact and upload the SBoM to Dependency Track
# 2. Pull the artefact back down, verify it and scan it with grype, uploading the results to the Security tab as a SARIF report

# It's designed to be called from a workflow_dispatch or a workflow_call event, but can be triggered by a push to the main or master branch.
# I haven't testing calling from an external organisation workflows yet, the scanning should work, but the attestation may not.

# Only the DepTrack-sbom job needs a self-hosted runner — it uploads to the internal
# Dependency-Track at dtrack.int.pgmac.net. You'll need a runner set up, running and
# tagged 'self-hosted' for that job to work. The GHAS-dependency-scan job has no homelab
# dependency and runs on a GitHub-hosted runner. See pgmac-net/homelabia#176.

# Because I'm using the free-tier of GitHub, I only have access to GHAS for public repositories, so the attestation and SARIF upload is only done for public repositories.

# To do attestations, we need the gh cli tool. The easiest/fastest way to install this is with mise-en-place

on:
  push:
    branches: ["master", "main"]
  pull_request: # Add this for PR validation
    types: [opened, synchronize]

  workflow_dispatch:
    inputs:
      runs-on:
        description: "Runner for the DepTrack-sbom job (GHAS-dependency-scan is always GitHub-hosted)"
        required: false
        type: choice # Optional: use 'choice' for dropdown in UI
        options:
          - self-hosted
        default: "self-hosted"
  workflow_call:
    inputs:
      runs-on:
        description: "Runner for the DepTrack-sbom job (GHAS-dependency-scan is always GitHub-hosted)"
        required: false
        type: string
        default: "self-hosted"
    secrets:
      DT_HOST:
        required: true
      DT_APIKEY:
        required: true

permissions:
  contents: read

jobs:
  DepTrack-sbom:
    # self-hosted by default: uploads the SBOM to the internal Dependency-Track
    # at dtrack.int.pgmac.net, which is only reachable from the homelab.
    runs-on: ${{ inputs.runs-on || 'self-hosted' }}
    outputs:
      dtrack-project-url: ${{ steps.dtrack-url.outputs.url }}
    timeout-minutes: 3
    permissions:
      id-token: write
      attestations: write
      actions: read
      contents: write # dependency-snapshot submits to the dependency graph API

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the CycloneDX SBoM for this directory
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./
          format: cyclonedx-json
          output-file: sbom.json
          artifact-name: sbom.json
          upload-artifact: true
          dependency-snapshot: true

      - name: Build the SHA256 digest
        id: sha256
        run: |
          echo "sha256=sha256:$(sha256sum sbom.json | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT

      - name: Attest the SBoM
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: sbom.json
          subject-digest: ${{ steps.sha256.outputs.sha256 }}
          show-summary: true
          push-to-registry: false

      - name: Upload SBoM to Dependency Track
        env:
          DT_HOST: ${{ secrets.DT_HOST }}
          DT_APIKEY: ${{ secrets.DT_APIKEY }}
          PROJECT_NAME: ${{ github.repository }}
          PROJECT_VERSION: ${{ github.sha }}
          PROJECT_TAGS: "${{ github.repository }}, ${{ github.ref_type }}, ${{ github.ref }}"
        run: |
          TAGS=$(printf '%s' "${PROJECT_TAGS}" | jq -Rc 'split(",") | map(gsub("^ +| +$"; "") | {name: .})')
          jq -n \
            --arg name "${PROJECT_NAME}" \
            --arg version "${PROJECT_VERSION}" \
            --argjson tags "${TAGS}" \
            --rawfile bom sbom.json \
            '{projectName: $name, projectVersion: $version, autoCreate: true, bom: ($bom | ltrimstr("\ufeff") | @base64), projectTags: $tags}' \
          | curl -sf -X PUT \
              -H "X-Api-Key: ${DT_APIKEY}" \
              -H "Content-Type: application/json" \
              -d @- \
              "https://${DT_HOST}/api/v1/bom"

      - name: Get DTrack project URL
        id: dtrack-url
        env:
          DT_HOST: ${{ secrets.DT_HOST }}
          DT_APIKEY: ${{ secrets.DT_APIKEY }}
          PROJECT_NAME: ${{ github.repository }}
          PROJECT_VERSION: ${{ github.sha }}
        run: |
          PROJECT_UUID=$(curl -sf \
            -H "X-Api-Key: ${DT_APIKEY}" \
            "https://${DT_HOST}/api/v1/project/lookup?name=${PROJECT_NAME}&version=${PROJECT_VERSION}" \
            | jq -r '.uuid')
          DTRACK_URL="https://${DT_HOST}/projects/${PROJECT_UUID}"
          echo "url=${DTRACK_URL}" >> "$GITHUB_OUTPUT"
          {
            echo "## Dependency Track"
            echo "[View project](${DTRACK_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"

  GHAS-dependency-scan:
    # GitHub-hosted: grype scan + PR comment, no homelab dependency. Hardcoded rather
    # than using inputs.runs-on, which is shared with DepTrack-sbom (which must stay
    # self-hosted). ubuntu-latest (not slim) because the steps need gh, grype, jq and curl.
    runs-on: ubuntu-latest
    needs: [DepTrack-sbom]
    permissions:
      actions: read # download-artifact
      contents: read
      security-events: write # SARIF upload
      pull-requests: write # scan summary comment

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools via mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          fetch_from_github: false

      - name: Download the SBoM Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Name of the artifact to download. If unspecified, all artifacts for the run are downloaded.
          name: sbom.json
          merge-multiple: false

      - name: Verify the artefact attestation
        if: github.event.repository.visibility == 'public'
        run: |
          gh attestation verify ./sbom.json --owner ${{ github.repository_owner }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Scan the SBoM for vulnerabilities # The grype SBoM scan only scans SPDX format SBoMs
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          sbom: sbom.json
          fail-build: false # Reporting only mode for now - change to true to fail the build
          #severity-cutoff: "medium" # Only fail the build if a vulnerability of this severity or higher is found
          only-fixed: true # Only report vulnerabilities that have a fix available
          output-format: sarif

      - name: Parse SARIF results
        id: comment
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          DTRACK_URL: ${{ needs.DepTrack-sbom.outputs.dtrack-project-url }}
        run: |
          TOTAL=$(jq -r '.runs[0].results | length' "${SARIF_FILE}" 2>/dev/null || echo "0")
          CRITICAL=$(jq -r '.runs[0].results[] | select(.level == "error") | .level' "${SARIF_FILE}" 2>/dev/null | wc -l | tr -d ' ')
          HIGH=$(jq -r '.runs[0].results[] | select(.level == "warning") | .level' "${SARIF_FILE}" 2>/dev/null | wc -l | tr -d ' ')
          MEDIUM=$(jq -r '.runs[0].results[] | select(.level == "note") | .level' "${SARIF_FILE}" 2>/dev/null | wc -l | tr -d ' ')

          # Write to file to avoid backtick interpretation in shell
          cat > /tmp/scan-results.md <<RESULTS
          ## SBoM Vulnerability Scan Results

          **Scan Summary:**
          - **Total vulnerabilities found:** ${TOTAL}
          - **Critical:** ${CRITICAL}
          - **High:** ${HIGH}
          - **Medium:** ${MEDIUM}

          **SBoM Details:**
          - Generated from commit: ${SHA}
          - SBoM format: CycloneDX
          - Repository: ${REPO}

          [View full SARIF report](https://github.com/${REPO}/security/code-scanning)

          > This comment will be updated on each commit
          RESULTS

          if [ -n "${DTRACK_URL}" ]; then
            echo "" >> /tmp/scan-results.md
            echo "**[View in Dependency Track](${DTRACK_URL})**" >> /tmp/scan-results.md
          fi

      - name: Add results to job summary
        run: cat /tmp/scan-results.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Find existing comment
        id: find-comment
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the REST API so the id is the numeric one the PATCH below needs
          # (gh pr view returns the GraphQL node id, which 404s on the REST endpoint).
          echo "comment_id=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq '.[] | select(.body | contains("SBoM Vulnerability Scan Results")) | .id' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Create or update comment
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_ID: ${{ steps.find-comment.outputs.comment_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${COMMENT_ID}" ]; then
            echo "Updating existing comment"
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" \
              --method PATCH --field body="$(cat /tmp/scan-results.md)"
          else
            echo "Creating new comment"
            gh pr comment "${PR_NUMBER}" --body-file /tmp/scan-results.md
          fi

      - name: Upload SBoM scan SARIF report
        # Free-tier GHAS only works on public repositories
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
