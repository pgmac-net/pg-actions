name: Dependabot Vulnerability Management

on:
  workflow_call:
    inputs:
      alert_number:
        description: Dependabot alert number
        required: true
        type: string
      package_name:
        description: Vulnerable package name
        required: true
        type: string
      package_ecosystem:
        description: Package ecosystem (npm, pip, maven, etc.)
        required: true
        type: string
      severity:
        description: Vulnerability severity (critical, high, medium, low)
        required: true
        type: string
      summary:
        description: Vulnerability summary
        required: true
        type: string
      cve_id:
        description: CVE ID if available
        required: false
        type: string
        default: ""
      ghsa_id:
        description: GitHub Security Advisory ID
        required: true
        type: string
      vulnerable_version_range:
        description: Affected version range
        required: true
        type: string
      first_patched_version:
        description: First version that contains the fix
        required: false
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  create-issue:
    name: Create GitHub Issue
    # GitHub-hosted: GitHub API only, no homelab dependency.
    # ubuntu-latest (not slim) because the steps need the gh CLI.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      issue_number: ${{ steps.create-issue.outputs.issue_number || steps.check-existing.outputs.issue_number }}
      issue_url: ${{ steps.create-issue.outputs.issue_url || steps.check-existing.outputs.issue_url }}
    steps:
      - name: Check for existing issue
        id: check-existing
        env:
          GH_TOKEN: ${{ github.token }}
          GHSA_ID: ${{ inputs.ghsa_id }}
          REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --search "${GHSA_ID} in:title" \
            --limit 1 \
            --json number,url)

          if [ "$(echo "$EXISTING" | jq 'length')" -gt "0" ]; then
            NUMBER=$(echo "$EXISTING" | jq -r '.[0].number')
            URL=$(echo "$EXISTING" | jq -r '.[0].url')
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=${NUMBER}" >> "$GITHUB_OUTPUT"
            echo "issue_url=${URL}" >> "$GITHUB_OUTPUT"
            echo "Existing issue found: #${NUMBER}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing issue for ${GHSA_ID} in ${REPO}"
          fi

      - name: Ensure labels exist
        if: steps.check-existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Idempotent: gh exits non-zero when the label already exists.
          create_label() {
            gh label create "$1" --repo "$REPO" --color "$2" --description "$3" 2>/dev/null || true
          }
          create_label "security" "d73a4a" "Security vulnerability"
          create_label "dependencies" "0366d6" "Dependency updates"
          create_label "severity:critical" "b60205" "Critical severity vulnerability"
          create_label "severity:high" "d93f0b" "High severity vulnerability"

      - name: Create issue
        id: create-issue
        if: steps.check-existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GHSA_ID: ${{ inputs.ghsa_id }}
          REPO: ${{ github.repository }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_ECOSYSTEM: ${{ inputs.package_ecosystem }}
          SEVERITY: ${{ inputs.severity }}
          SUMMARY: ${{ inputs.summary }}
          CVE_ID: ${{ inputs.cve_id }}
          VULN_RANGE: ${{ inputs.vulnerable_version_range }}
          PATCHED_VERSION: ${{ inputs.first_patched_version }}
          ALERT_NUMBER: ${{ inputs.alert_number }}
        run: |
          case "$SEVERITY" in
            critical) SEVERITY_LABEL="severity:critical" ;;
            *)        SEVERITY_LABEL="severity:high" ;;
          esac

          ALERT_URL="https://github.com/${REPO}/security/dependabot/${ALERT_NUMBER}"
          CVE_TEXT="${CVE_ID:-N/A}"
          PATCHED_TEXT="${PATCHED_VERSION:-None available}"

          NL=$'\n'
          BODY="## Dependabot Security Alert${NL}${NL}**Repository:** ${REPO}${NL}**Package:** ${PACKAGE_NAME} (${PACKAGE_ECOSYSTEM})${NL}**Severity:** ${SEVERITY}${NL}**GHSA:** [${GHSA_ID}](https://github.com/advisories/${GHSA_ID})${NL}**CVE:** ${CVE_TEXT}${NL}**Vulnerable versions:** ${VULN_RANGE}${NL}**First patched version:** ${PATCHED_TEXT}${NL}${NL}[View Dependabot Alert](${ALERT_URL})${NL}${NL}---${NL}A draft fix PR will be created automatically via Claude Code."

          URL=$(gh issue create \
            --repo "$REPO" \
            --title "${GHSA_ID}: ${SUMMARY}" \
            --body "$BODY" \
            --label "security" \
            --label "dependencies" \
            --label "$SEVERITY_LABEL")

          if [ -z "$URL" ]; then
            echo "Error creating GitHub issue"
            exit 1
          fi

          NUMBER="${URL##*/}"
          echo "issue_number=${NUMBER}" >> "$GITHUB_OUTPUT"
          echo "issue_url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Created GitHub issue: #${NUMBER} — ${URL}"

  create-fix-pr:
    name: Create Fix PR via Claude Code
    needs: create-issue
    # GitHub-hosted: Claude Code action + GitHub API + git push, no homelab dependency.
    # ubuntu-latest (not slim) because the steps need jq, curl and npm.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check CLAUDE_CODE_OAUTH_TOKEN
        id: check-key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_URL: ${{ needs.create-issue.outputs.issue_url }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CLAUDE_CODE_OAUTH_TOKEN not set — skipping PR creation"
            echo "Fix manually: ${ISSUE_URL}"
          fi

      - name: Check for existing PR
        id: check-pr
        if: steps.check-key.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GHSA_ID: ${{ inputs.ghsa_id }}
          REPO: ${{ github.repository }}
        run: |
          COUNT=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/search/issues?q=${GHSA_ID}+in:title+repo:${REPO}+is:pr+is:open" | \
            jq '.total_count')
          echo "exists=$([ "${COUNT}" -gt "0" ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.check-key.outputs.available == 'true' && steps.check-pr.outputs.exists != 'true'

      - name: Create fix branch
        id: branch
        if: steps.check-key.outputs.available == 'true' && steps.check-pr.outputs.exists != 'true'
        env:
          GHSA_ID: ${{ inputs.ghsa_id }}
        run: |
          BRANCH="fix/dependabot/${GHSA_ID}"
          git checkout -b "$BRANCH"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code to fix vulnerability
        if: steps.check-key.outputs.available == 'true' && steps.check-pr.outputs.exists != 'true'
        uses: anthropics/claude-code-base-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
          timeout_minutes: "15"
          prompt: |
            Fix the following Dependabot security vulnerability in this repository:

            Package: ${{ inputs.package_name }} (${{ inputs.package_ecosystem }})
            Severity: ${{ inputs.severity }}
            Vulnerability: ${{ inputs.summary }}
            GHSA ID: ${{ inputs.ghsa_id }}
            CVE: ${{ inputs.cve_id || 'N/A' }}
            Vulnerable version range: ${{ inputs.vulnerable_version_range }}
            First patched version: ${{ inputs.first_patched_version || 'latest stable' }}
            GitHub issue: #${{ needs.create-issue.outputs.issue_number }}

            Steps:
            1. Update ${{ inputs.package_name }} to version ${{ inputs.first_patched_version || 'the latest stable version' }} or later
            2. Update any lock files (package-lock.json, yarn.lock, requirements.txt, poetry.lock, etc.)
            3. Fix any breaking API changes introduced by the version upgrade
            4. Keep changes minimal — only what resolves this specific vulnerability
            5. Do not commit or create a PR — the workflow handles that

      - name: Check for changes
        id: changes
        if: steps.check-key.outputs.available == 'true' && steps.check-pr.outputs.exists != 'true'
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: >-
          steps.check-key.outputs.available == 'true' &&
          steps.check-pr.outputs.exists != 'true' &&
          steps.changes.outputs.has_changes == 'true'
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          GHSA_ID: ${{ inputs.ghsa_id }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: update ${PACKAGE_NAME} to address ${GHSA_ID}"
          git push origin "$BRANCH"

      - name: Create draft PR
        if: >-
          steps.check-key.outputs.available == 'true' &&
          steps.check-pr.outputs.exists != 'true' &&
          steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          ALERT_NUMBER: ${{ inputs.alert_number }}
          SUMMARY: ${{ inputs.summary }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_ECOSYSTEM: ${{ inputs.package_ecosystem }}
          SEVERITY: ${{ inputs.severity }}
          GHSA_ID: ${{ inputs.ghsa_id }}
          CVE_ID: ${{ inputs.cve_id }}
          VULN_RANGE: ${{ inputs.vulnerable_version_range }}
          PATCHED_VERSION: ${{ inputs.first_patched_version }}
          ISSUE_URL: ${{ needs.create-issue.outputs.issue_url }}
          ISSUE_NUMBER: ${{ needs.create-issue.outputs.issue_number }}
        run: |
          NL=$'\n'
          PR_BODY="## Security Vulnerability Fix${NL}${NL}Addresses Dependabot alert #${ALERT_NUMBER}: **${SUMMARY}**${NL}${NL}| Field | Value |${NL}|-------|-------|${NL}| Package | \`${PACKAGE_NAME}\` (${PACKAGE_ECOSYSTEM}) |${NL}| Severity | ${SEVERITY} |${NL}| GHSA | [${GHSA_ID}](https://github.com/advisories/${GHSA_ID}) |${NL}| CVE | ${CVE_ID:-N/A} |${NL}| Vulnerable range | ${VULN_RANGE} |${NL}| Fixed in | ${PATCHED_VERSION:-latest} |${NL}${NL}Closes #${ISSUE_NUMBER}${NL}${NL}> 🤖 Generated by [Claude Code](https://claude.ai/claude-code) via [dependabot-management](https://github.com/pgmac-net/pg-actions)"

          BASE=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}" | \
            jq -r '.default_branch')

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls" \
            -d "$(jq -n \
              --arg title "fix(${PACKAGE_NAME}): address ${GHSA_ID}" \
              --arg body "$PR_BODY" \
              --arg head "$BRANCH" \
              --arg base "$BASE" \
              '{title: $title, body: $body, head: $head, base: $base, draft: true}')")

          PR_URL=$(echo "$RESPONSE" | jq -r '.html_url')
          if [ "$PR_URL" = "null" ] || [ -z "$PR_URL" ]; then
            echo "Error creating PR:"
            echo "$RESPONSE" | jq .
            exit 1
          fi
          echo "Created PR: $PR_URL"

      - name: No automatic fix available
        if: >-
          steps.check-key.outputs.available == 'true' &&
          steps.check-pr.outputs.exists != 'true' &&
          steps.changes.outputs.has_changes == 'false'
        env:
          GHSA_ID: ${{ inputs.ghsa_id }}
          ISSUE_URL: ${{ needs.create-issue.outputs.issue_url }}
        run: |
          echo "Claude Code could not generate an automatic fix for ${GHSA_ID}."
          echo "Manual fix required. Issue: ${ISSUE_URL}"
