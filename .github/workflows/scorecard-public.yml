name: OpenSSF Scorecard (public)

# Reusable workflow for public repositories.
# Runs the OpenSSF Scorecard checks and uploads results as an artifact and
# to the GitHub Security tab (SARIF). Results are NOT published to the OpenSSF
# public API (publish_results: false).

on:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: "0 14 * * 0" # 00:00 AEST every Sunday
  workflow_dispatch:
    inputs:
      runs-on:
        description: "Runner to use for the job"
        required: false
        type: choice
        options:
          - ubuntu-latest
        default: "ubuntu-latest"
  workflow_call:
    inputs:
      runs-on:
        description: "Runner to use for the job"
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 30

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard-results.sarif
